[build-system]
requires = ["setuptools >= 64", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "flopyarcade"
version = "0.7.0"
description="Simulated groundwater flow environments for reinforcement learning."
readme = "README.md"
urls = {Homepage = "https://github.com/philipphoehn/flopyarcade", Documentation = "https://flopyarcade.readthedocs.io"}
authors = [
  { name = "Philipp Hoehn", email = "philipp.hoehn@yahoo.com" }
]
requires-python = ">=3.7, <3.13"
license={text = "GNU GPLv3"}
dependencies = [
	"flopy >= 3.9.2",
	"gymnasium >= 0.29.1",
	"imageio >= 2.22.4",
	"importlib-metadata >= 4.13.0",
	"joblib >= 1.2.0",
	"lz4 >= 4.0.2",
	"matplotlib >= 3.6.2",
	"numpy >= 2.1.3",
	"pandas >= 2.2.0",
	"pathos >= 0.3.0",
	"pillow >= 10.4.0",
	"pygame >= 2.1.2",
	"scikit-image >= 0.23.0",
	"tqdm >= 4.64.1",
	"xmipy == 1.3.0",
]

[project.optional-dependencies]
solvers = [
	"tensorflow >= 2.16.0",
	"ipython >= 7.34.0",
]
ray = [
	"ray[all] >= 2.43.0",
	"ray[tune] >= 2.43.0",
	"ray[rllib] >= 2.43.0",
]
all = [
	"flopyarcade[solvers,ray]",
]
dev = [
	"pytest",
	"pytest-cov",
	"coverage",
]
classifiers = [
	'Development Status :: 3 - Alpha',
	'Intended Audience :: Science/Research',
	'Intended Audience :: Education',
	'Intended Audience :: Developers',
	'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
	'Natural Language :: English',
	'Operating System :: POSIX :: Linux',
	'Operating System :: Microsoft :: Windows',
	'Programming Language :: Python :: 3',
	'Programming Language :: Python :: 3 :: Only',
	'Topic :: Scientific/Engineering',
	'Topic :: Scientific/Engineering :: Hydrology',
	'Topic :: Scientific/Engineering :: Artificial Intelligence',
	'Topic :: Education',
]
[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
