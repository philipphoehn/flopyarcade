name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest-timeout

      - name: Run tests
        env:
          PYTHONWARNINGS: "ignore::ResourceWarning"
          PYTHONPATH: "flopyarcade"
        run: |
          pytest flopyarcade/tests/ -v --timeout=1800
