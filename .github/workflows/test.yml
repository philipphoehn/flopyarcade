name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/lib/llvm-* /usr/local/lib/android 2>/dev/null || true
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true

      - name: Install
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -e ".[solvers]" pytest-timeout pytest-cov

      - name: Extract simulators
        run: |
          cd flopyarcade/simulators
          unzip -o simulators_linux.zip
          chmod +x linux/mf2005 linux/mf6 linux/mp6 2>/dev/null || true

      - name: Run tests with coverage
        continue-on-error: true
        env:
          PYTHONWARNINGS: "ignore::ResourceWarning"
        run: |
          pytest flopyarcade/tests/ -v --timeout=1800 \
            -m "not slow" \
            --cov=flopyarcade --cov-config=.coveragerc \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage to CodeCov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
