name: Build Mac Prototype (build-branch)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach to'
        required: false
        default: 'v0.3.34-exe'

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: build
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            tensorflow>=2.11 \
            'flopy>=3.9.2' \
            matplotlib>=3.6 \
            numpy>=1.24 \
            pandas>=1.5 \
            pathos>=0.3 \
            imageio>=2.19 \
            tqdm>=4.60
          pip install pyinstaller

      - name: Make simulators executable
        run: |
          chmod +x simulators/mp6 simulators/mf2005 2>/dev/null || true

      - name: Build with PyInstaller
        run: |
          pyinstaller FloPyArcadePlay.spec --clean --noconfirm

      - name: Verify binary
        run: |
          ls -lh dist/FloPyArcadePlay
          file dist/FloPyArcadePlay
          # Quick smoke test (will fail without display, but verifies it starts)
          timeout 15 ./dist/FloPyArcadePlay 2>&1 | head -20 || true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" dist/FloPyArcadePlay \
            --repo philipphoehn/flopyarcade \
            --clobber \
            --name "FloPyArcadePlay-macos-arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flopyarcade-macos-arm64
          path: dist/FloPyArcadePlay
