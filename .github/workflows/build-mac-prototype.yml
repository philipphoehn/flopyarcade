name: Build Mac Prototype (build-branch)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach to'
        required: false
        default: 'v0.3.34-exe'

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: build
          fetch-depth: 1

      - name: Verify checkout (verbose self-diagnose)
        run: |
          echo "=== Checking whether build-branch files landed ==="
          if [ -f FloPyArcadePlay.spec ]; then
            echo "OK: FloPyArcadePlay.spec present"
            ls -la FloPyArcadePlay.spec FloPyArcadePlay.py
            exit 0
          fi
          echo "!! expected files missing; running verbose manual clone to capture the real git error"
          set +e
          rm -rf /tmp/fb_verify
          git clone --verbose --depth 1 -b build https://github.com/philipphoehn/flopyarcade /tmp/fb_verify 2>&1 | tail -40
          echo "clone exit: ${PIPESTATUS[0]}"
          if [ -f /tmp/fb_verify/FloPyArcadePlay.spec ]; then
            echo "manual clone OK; copying into workspace"
            cp -a /tmp/fb_verify/. .
            echo "restored via manual clone"
            exit 0
          fi
          echo "FATAL: could not obtain build branch; aborting (see error above)"
          exit 1

      - name: Fetch Mac simulators from master
        run: |
          # The build branch has Linux ELF simulators. We need macOS ARM64 ones.
          # Fetch them from master's flopyarcade/simulators/mac/ directory.
          git fetch origin master --depth=1
          mkdir -p simulators/mac
          git show origin/master:flopyarcade/simulators/mac/mp6 > simulators/mac/mp6 2>/dev/null || \
            git archive --remote=origin master flopyarcade/simulators/mac/ | tar -x --strip-components=2 -C simulators/mac/ 2>/dev/null || \
            echo "Falling back: will use pip-installed flopy simulators"
          # If git show failed, try downloading from the GitHub raw URL
          if [ ! -f simulators/mac/mp6 ]; then
            echo "Downloading Mac simulators from GitHub raw..."
            curl -sL -o simulators/mac/mp6 "https://raw.githubusercontent.com/philipphoehn/flopyarcade/master/flopyarcade/simulators/mac/mp6" || true
            curl -sL -o simulators/mac/mf2005 "https://raw.githubusercontent.com/philipphoehn/flopyarcade/master/flopyarcade/simulators/mac/mf2005" || true
            curl -sL -o simulators/mac/libmf6.so "https://raw.githubusercontent.com/philipphoehn/flopyarcade/master/flopyarcade/simulators/mac/libmf6.so" || true
          fi
          chmod +x simulators/mac/* 2>/dev/null || true
          ls -la simulators/ simulators/mac/ 2>/dev/null || true
          # Replace the Linux simulators with Mac ones for bundling
          if [ -d simulators/mac ] && [ -f simulators/mac/mf2005 ]; then
            cp simulators/mac/mf2005 simulators/mf2005
            cp simulators/mac/mp6 simulators/mp6 2>/dev/null || true
            echo "Mac simulators in place"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            tensorflow>=2.11 \
            'flopy>=3.9.2' \
            matplotlib>=3.6 \
            numpy>=1.24 \
            pandas>=1.5 \
            pathos>=0.3 \
            imageio>=2.19 \
            tqdm>=4.60
          pip install pyinstaller

      - name: Verify environment
        run: |
          python -c "import tensorflow as tf; print(f'TF {tf.__version__} OK')"
          python -c "import flopy; print(f'flopy {flopy.__version__} OK')"
          python -c "import matplotlib; print(f'matplotlib data: {matplotlib.get_data_path()}')"
          file simulators/mf2005
          file simulators/mp6 2>/dev/null || echo "mp6 not present"

      - name: Build with PyInstaller
        run: |
          pyinstaller FloPyArcadePlay.spec --clean --noconfirm 2>&1 | tee pyinstaller_build.log
          echo "=== Build finished ==="
          ls -lh dist/FloPyArcadePlay
          file dist/FloPyArcadePlay

      - name: Smoke test (headless)
        run: |
          echo "=== Running FloPyArcade headless on macOS ARM64 ==="
          echo "Binary: $(file dist/FloPyArcadePlay)"
          echo "Size: $(ls -lh dist/FloPyArcadePlay | awk '{print $5}')"
          echo ""
          # macOS has no GNU timeout; use perl alarm (always present)
          perl -e 'alarm shift; exec @ARGV' 180 ./dist/FloPyArcadePlay 2>&1 | tee mac_smoke_test.log || true
          echo ""
          echo "=== Smoke test output (last 30 lines) ==="
          tail -30 mac_smoke_test.log
          echo "=== Done ==="

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-smoke-test-log
          path: mac_smoke_test.log

      - name: Upload PyInstaller build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-build-log
          path: pyinstaller_build.log

      - name: Upload binary artifact (always preserve)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flopyarcade-macos-arm64
          path: dist/FloPyArcadePlay

      - name: Upload to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ inputs.release_tag }}"
          # Ensure the release exists (create if not)
          gh release view "$TAG" --repo philipphoehn/flopyarcade 2>/dev/null || \
            gh release create "$TAG" --repo philipphoehn/flopyarcade \
              --title "FloPyArcade $TAG" \
              --notes "Multi-platform standalone executables." \
              --prerelease
          # Upload (clobber existing same-name asset)
          gh release upload "$TAG" dist/FloPyArcadePlay \
            --repo philipphoehn/flopyarcade \
            --clobber \
            --name "FloPyArcadePlay-macos-arm64"
          echo "✅ Uploaded to release $TAG"
