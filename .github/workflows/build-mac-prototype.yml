name: Build Mac Prototype

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach to'
        required: false
        default: 'v0.3.34-exe'

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            'tensorflow>=2.11' \
            'flopy>=3.9.2' \
            'matplotlib>=3.6' \
            'numpy>=1.24' \
            'pandas>=1.5' \
            'pathos>=0.3' \
            'imageio>=2.19' \
            'tqdm>=4.60'
          pip install pyinstaller

      - name: Verify environment
        run: |
          python -c "import tensorflow as tf; print(f'TF {tf.__version__} OK')"
          python -c "import flopy; print(f'flopy {flopy.__version__} OK')"
          python -c "import matplotlib; print(f'matplotlib: {matplotlib.get_data_path()}')"
          echo "=== Build source (mac-build/) ==="
          ls -la mac-build/FloPyArcadePlay.py mac-build/FloPyArcadePlay.spec mac-build/FloPyArcade.py
          echo "=== Simulators ==="
          ls -la mac-build/simulators/
          file mac-build/simulators/mf2005 2>/dev/null || echo "mf2005 not found"

      - name: Build with PyInstaller
        run: |
          cd mac-build
          pyinstaller FloPyArcadePlay.spec --clean --noconfirm 2>&1 | tee pyinstaller_build.log
          echo "=== Build finished ==="
          ls -lh dist/FloPyArcadePlay
          file dist/FloPyArcadePlay

      - name: Smoke test (headless)
        run: |
          cd mac-build
          echo "=== Running FloPyArcade headless on macOS ARM64 ==="
          echo "Binary: $(file dist/FloPyArcadePlay)"
          echo "Size: $(ls -lh dist/FloPyArcadePlay | awk '{print $5}')"
          echo ""
          # macOS has no GNU timeout; use perl alarm (always present)
          perl -e 'alarm shift; exec @ARGV' 180 ./dist/FloPyArcadePlay 2>&1 | tee mac_smoke_test.log || true
          echo ""
          echo "=== Smoke test output (last 40 lines) ==="
          tail -40 mac_smoke_test.log
          echo "=== Done ==="

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-smoke-test-log
          path: mac-build/mac_smoke_test.log

      - name: Upload PyInstaller build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-build-log
          path: mac-build/pyinstaller_build.log

      - name: Upload binary artifact (always preserve)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flopyarcade-macos-arm64
          path: mac-build/dist/FloPyArcadePlay

      - name: Upload to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ inputs.release_tag }}"
          gh release view "$TAG" --repo philipphoehn/flopyarcade 2>/dev/null || \
            gh release create "$TAG" --repo philipphoehn/flopyarcade \
              --title "FloPyArcade $TAG" \
              --notes "Multi-platform standalone executables." \
              --prerelease
          gh release upload "$TAG" mac-build/dist/FloPyArcadePlay \
            --repo philipphoehn/flopyarcade \
            --clobber \
            --name "FloPyArcadePlay-macos-arm64"
          echo "✅ Uploaded to release $TAG"
